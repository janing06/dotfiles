[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
open = [
  { run = 'open "$@"', for = "macos" },
]
play = [
  { run = 'mpv "$@"', for = "unix" },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "*/javascript", use = "edit" },
  { mime = "*/typescript", use = "edit" },
  { mime = "*/xml", use = "edit" },
  { mime = "inode/empty", use = "edit" },
  { mime = "image/*", use = "play" },
  { mime = "video/*", use = "play" },
  { mime = "*", use = "open" },
]