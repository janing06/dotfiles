##### Reload config #####
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

##### Prefix key #####
set -g prefix C-s

##### General settings #####
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mode-keys vi
set -g status-keys emacs
set-option -g status-position top
set-option -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g default-terminal "${TERM}"
set -g pane-active-border-style 'fg=magenta,bg=default'

# Remap copy-mode to prefix + m
unbind [
bind m copy-mode

##### Copy mode (Vim-style) #####
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Shift+K / Shift+J = half page up / down (like Vim Ctrl-U / Ctrl-D)
bind -T copy-mode-vi K send -X halfpage-up
bind -T copy-mode-vi J send -X halfpage-down

bind \` switch-client -t'{marked}'

# Go to highest numbered window (C-s 9)
bind 9 run-shell "tmux select-window -t $(tmux list-windows | awk -F: '{print \$1}' | sort -n | tail -1)"

##### TPM Plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.1'

##### Catppuccin theme #####
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# ✅ Force session name in tabs
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# ✅ Remove host/machine name
set -g @catppuccin_status_host ""

##### Status bar #####
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# Right status modules
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag  status-right "#{E:@catppuccin_status_session}"
set -ag  status-right "#{E:@catppuccin_status_uptime}"

##### Load Catppuccin theme #####
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# Show "claude" instead of the version number for Claude Code windows
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'

##### tmux.expose (Ghostty cmd+s sends prefix + e) #####
set -g @tmux-expose-key 'e'
set -g @tmux-expose-key-table 'prefix'
set -g @tmux-expose-vim-keys 'on'
set -g @tmux-expose-agent-sort 'off'
set -g @tmux-expose-command '~/.cargo/bin/tmux-expose --sort-by created'
set -g @plugin 'cesarferreira/tmux.expose'

##### TPM init (must be last line) #####
# TPM defaults to ~/.config/tmux/plugins when this file lives there; keep plugins in ~/.tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'

# Left-align prompts (Catppuccin centres them; must follow TPM, which re-applies the theme)
set -g message-style "fg=#94e2d5,bg=#313244,fill=#313244"
set -g message-command-style "fg=#94e2d5,bg=#313244,fill=#313244"
